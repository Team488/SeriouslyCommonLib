# Gradle performance tuning (used locally and in CI).
# CI sets the same flags via GRADLE_OPTS; keeping them here makes local builds fast too.
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configureondemand=true
org.gradle.daemon=true
# Keep the daemon from outliving CI agents / eating dev-machine memory.
org.gradle.daemon.idletimeout=60000
kotlin.incremental=true
